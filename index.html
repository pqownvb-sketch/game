<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#07070b">
<title>المجرم والمواطنين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070b; --bg2:#0f0b12; --glass:rgba(255,255,255,.05); --glass-b:rgba(255,255,255,.12);
  --crimson:#c1121f; --crimson-glow:#ff2a3d; --gold:#e6b800; --gold2:#ffd966;
  --text:#f2ece4; --mut:#a89fa6; --ok:#3ddc97;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Cairo','Tajawal',system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(193,18,31,.22),transparent 60%),radial-gradient(800px 500px at 100% 110%,rgba(230,184,0,.08),transparent 60%),var(--bg)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input{font-family:inherit}
.hidden{display:none!important}
#app{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
#app.noscroll{overflow:hidden;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
h1.logo{font-weight:900;font-size:34px;text-align:center;margin:18px 0 4px;letter-spacing:.5px;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 45%,#a37a00);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(230,184,0,.25)}
.sub{text-align:center;color:var(--mut);font-size:14px;margin-bottom:18px}
.btn{padding:14px 18px;border-radius:14px;font-weight:800;font-size:17px;transition:transform .12s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.red{background:linear-gradient(180deg,#e0212f,var(--crimson));box-shadow:0 0 22px rgba(255,42,61,.35)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1f00;box-shadow:0 0 22px rgba(230,184,0,.3)}
.btn.ghost{background:var(--glass);border:1px solid var(--glass-b)}
.btn.block{width:100%}
.field{width:100%;padding:14px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid var(--glass-b);color:var(--text);font-size:17px;text-align:center;outline:none}
.field:focus{border-color:var(--crimson-glow);box-shadow:0 0 0 3px rgba(255,42,61,.18)}
.stack{display:flex;flex-direction:column;gap:12px}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center}
.center{text-align:center}
.mut{color:var(--mut)}

/* الشارات الدائمة */
.badges{display:flex;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;z-index:20}
.badge{flex:1;padding:7px 10px;border-radius:12px;text-align:center;font-weight:800;font-size:14px;line-height:1.2;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(10px)}
.badge small{display:block;font-weight:600;font-size:11px;color:var(--mut)}
.badge.criminal{border-color:var(--crimson-glow);box-shadow:0 0 14px rgba(255,42,61,.4);color:#ff6b78}
.badge.partner{border-color:#b266ff;box-shadow:0 0 14px rgba(178,102,255,.4);color:#d2a3ff}
.badge.citizen{border-color:var(--ok);box-shadow:0 0 12px rgba(61,220,151,.25);color:var(--ok)}
.badge.hour{border-color:var(--gold);box-shadow:0 0 12px rgba(230,184,0,.3);color:var(--gold2)}
.badge.unknown{color:var(--mut)}

/* اللوبي */
.code-box{font-size:40px;font-weight:900;letter-spacing:10px;text-align:center;color:var(--gold2);padding:10px 0 10px 10px;direction:ltr}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--glass-b)}
.pitem .av{font-size:26px}
.pitem .nm{flex:1;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.off{background:#666;box-shadow:none}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(230,184,0,.15);color:var(--gold2);border:1px solid rgba(230,184,0,.3)}

/* كشف البطاقات */
.cards{display:flex;gap:14px;justify-content:center;margin:10px 0 18px;perspective:1000px}
.flipwrap{flex:1;max-width:190px;aspect-ratio:2/3.1;perspective:1000px}
.card3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;text-align:center}
.face.front{background:linear-gradient(160deg,#1a0f14,#0b0709);border:2px solid var(--gold);box-shadow:0 0 24px rgba(230,184,0,.25),inset 0 0 40px rgba(193,18,31,.18);font-size:46px}
.face.front span{font-size:14px;color:var(--gold2);font-weight:700}
.face.back{transform:rotateY(180deg);border:2px solid var(--glass-b);background:linear-gradient(160deg,#16101a,#09070c)}
.face.back .big{font-size:64px;font-weight:900;line-height:1}
.face.back .ico{font-size:44px}
.face.back.criminal{border-color:var(--crimson-glow);box-shadow:0 0 30px rgba(255,42,61,.5);color:#ff6b78}
.face.back.citizen{border-color:var(--ok);box-shadow:0 0 24px rgba(61,220,151,.3);color:var(--ok)}
.face.back.hour{border-color:var(--gold);box-shadow:0 0 24px rgba(230,184,0,.35);color:var(--gold2)}

/* شاشة الساعات */
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.clock{display:flex;gap:6px;justify-content:center}
.pill{flex:1;max-width:64px;text-align:center;padding:6px 0;border-radius:12px;font-weight:900;font-size:18px;background:var(--glass);border:1px solid var(--glass-b);color:var(--mut);position:relative}
.pill.past{opacity:.35}
.pill.now{color:#fff;background:linear-gradient(180deg,#e0212f,var(--crimson));border-color:var(--crimson-glow);box-shadow:0 0 18px rgba(255,42,61,.6);transform:scale(1.08)}
.pill.mine::after{content:'👁';position:absolute;top:-8px;left:-4px;font-size:13px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--crimson-glow));transform-origin:right;border-radius:99px}
.tablearea{position:relative;flex:1;min-height:0;max-height:420px;width:100%;margin:0 auto}
.table{position:absolute;inset:20% 14%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#3a1a1f,#1a0b0f 70%);border:3px solid var(--gold);box-shadow:0 0 40px rgba(193,18,31,.35),inset 0 0 40px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.gem{font-size:clamp(40px,12vw,64px);filter:drop-shadow(0 0 14px rgba(255,42,61,.9)) drop-shadow(0 0 28px rgba(230,184,0,.6));animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.1);filter:drop-shadow(0 0 22px rgba(255,42,61,1)) drop-shadow(0 0 40px rgba(230,184,0,.9))}}
.gem.steal{animation:stealgem .9s ease-in forwards}
@keyframes stealgem{0%{transform:scale(1.1)}60%{transform:translateY(-30px) scale(1.3);opacity:1}100%{transform:translateY(-120px) scale(.2);opacity:0}}
.empty-slot{width:56px;height:56px;border-radius:50%;border:2px dashed rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px}
.seat{position:absolute;transform:translate(-50%,-50%);text-align:center;width:74px}
.seat .av{font-size:30px;line-height:1;filter:drop-shadow(0 0 6px rgba(255,255,255,.3))}
.seat .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.me .nm{color:var(--gold2)}
.alert{padding:10px 12px;border-radius:14px;text-align:center;font-weight:900;font-size:16px;background:rgba(193,18,31,.25);border:1px solid var(--crimson-glow);box-shadow:0 0 22px rgba(255,42,61,.5);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 36px rgba(255,42,61,.9)}}
.steal-btn{padding:16px;font-size:20px;font-weight:900;border-radius:16px;background:linear-gradient(180deg,#ff3b4d,#a40d19);box-shadow:0 0 30px rgba(255,42,61,.8);animation:pulse 1.1s infinite}
.sleep{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--mut);font-size:20px;font-weight:700;background:radial-gradient(circle at 50% 50%,#0a0a10,#000);border-radius:20px;border:1px solid rgba(255,255,255,.05)}
.sleep .zz{font-size:54px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.eyelid{position:absolute;left:-10px;right:-10px;background:#000;z-index:10;pointer-events:none}
.eyelid.top{top:-10px;height:52%;border-radius:0 0 50% 50%/0 0 30% 30%;animation:lidTop 1.1s cubic-bezier(.3,.7,.2,1) forwards}
.eyelid.bot{bottom:-10px;height:52%;border-radius:50% 50% 0 0/30% 30% 0 0;animation:lidBot 1.1s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes lidTop{from{transform:translateY(0)}to{transform:translateY(-105%)}}
@keyframes lidBot{from{transform:translateY(0)}to{transform:translateY(105%)}}
.opening .tablearea{animation:unblur 1.2s ease-out}
@keyframes unblur{from{filter:blur(12px) brightness(.4)}to{filter:none}}

/* النقاش */
.dtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.timer{font-weight:900;font-size:26px;color:var(--gold2);direction:ltr;min-width:80px;text-align:center;text-shadow:0 0 14px rgba(230,184,0,.4)}
.pgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.pc{width:68px;text-align:center;position:relative;transition:opacity .2s}
.pc .ring{width:54px;height:54px;margin:0 auto 2px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(0,0,0,.4);border:2px solid var(--glass-b);transition:box-shadow .12s,border-color .12s}
.pc.speaking .ring{border-color:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.35),0 0 20px rgba(61,220,151,.9)}
.pc.off{opacity:.4}
.pc .nm{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .chk{position:absolute;top:-4px;right:6px;font-size:14px}
.chatbox{flex:1;min-height:90px;display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.msg{font-size:14px;line-height:1.4}
.msg b{color:var(--gold2)}
.msg.mine b{color:var(--ok)}
.chatform{display:flex;gap:6px;padding:8px;border-top:1px solid var(--glass-b)}
.chatform input{flex:1;padding:10px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--glass-b);color:var(--text);font-size:15px;outline:none;min-width:0}
.mic{width:48px;height:48px;border-radius:50%;font-size:22px;background:var(--glass);border:2px solid var(--ok);flex:none}
.mic.muted{border-color:var(--crimson-glow);background:rgba(193,18,31,.3)}
.dbottom{display:flex;gap:8px;margin-top:8px;align-items:center}

/* التصويت والنهاية */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcard{padding:14px 8px;border-radius:16px;background:var(--glass);border:2px solid var(--glass-b);text-align:center;font-weight:800}
.vcard .av{font-size:36px}
.vcard.sel{border-color:var(--crimson-glow);box-shadow:0 0 24px rgba(255,42,61,.6);background:rgba(193,18,31,.2)}
.banner{padding:18px;border-radius:18px;text-align:center;font-weight:900;font-size:24px;animation:pop .7s cubic-bezier(.2,1.4,.3,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.banner.win{background:rgba(61,220,151,.12);border:2px solid var(--ok);color:var(--ok);box-shadow:0 0 30px rgba(61,220,151,.4)}
.banner.lose{background:rgba(193,18,31,.2);border:2px solid var(--crimson-glow);color:#ff6b78;box-shadow:0 0 30px rgba(255,42,61,.5)}
.rrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:rgba(0,0,0,.3);font-size:14px;opacity:0;animation:fadein .5s forwards}
@keyframes fadein{to{opacity:1}}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:800}
.chip.criminal{background:rgba(193,18,31,.3);color:#ff6b78}
.chip.partner{background:rgba(178,102,255,.25);color:#d2a3ff}
.chip.citizen{background:rgba(61,220,151,.15);color:var(--ok)}
.score{margin-inline-start:auto;font-weight:900;color:var(--gold2)}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:12px;right:12px;z-index:50;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:12px 16px;border-radius:14px;background:rgba(15,10,18,.95);border:1px solid var(--gold);color:var(--text);font-weight:700;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:pop .4s}
.toast.secret{border-color:#b266ff;box-shadow:0 0 30px rgba(178,102,255,.6)}
@media (max-height:640px){h1.logo{font-size:26px;margin:6px 0}.sub{margin-bottom:8px}}
</style>
</head>
<body>
<div id="badges" class="badges hidden"></div>
<main id="app"></main>
<div id="toast"></div>
<div id="audio-host" class="hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
'use strict';
/* ================= أدوات ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let myId = store.get('cvc_pid');
if (!myId) { myId = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store.set('cvc_pid', myId); }

const app = $('#app');
const socket = io({ reconnection: true, reconnectionDelay: 300, reconnectionDelayMax: 2000 });
let S = null;            // آخر حالة من السيرفر
let prev = null;
let offset = 0;          // فرق الوقت بين السيرفر والعميل
let built = '';          // اسم الشاشة المبنية (للشاشات ذات الهيكل الثابت)
let flips = { role: false, hour: false };
let eyeKey = '', theftSeen = 0, eyeAnim = false, stealAnim = false;
let chat = [];
let micMuted = false;

function toast(msg, cls = '', ms = 4500) {
  const el = document.createElement('div');
  el.className = 'toast ' + cls;
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* ================= الاتصال واستعادة الجلسة ================= */
function joinRoom(code, name, silent) {
  socket.emit('room:join', { code, name, playerId: myId }, (res) => {
    if (res && res.ok) {
      store.set('cvc_room', res.code);
      if (voiceOn) { closeAllPeers(); joinVoiceChannel(); }
    } else {
      if (silent) { store.del('cvc_room'); S = null; render(); }
      toast((res && res.error) || 'تعذر الانضمام');
    }
  });
}
socket.on('connect', () => {
  const code = store.get('cvc_room');
  if (code) joinRoom(code, store.get('cvc_name') || '', true);
  else render();
});

socket.on('state', (st) => {
  prev = S; S = st;
  offset = st.now - Date.now();
  onState();
});
socket.on('chat:msg', (m) => {
  chat.push(m);
  if (chat.length > 100) chat.shift();
  if (built === 'discussion' || built === 'voting') renderMsgs();
});

function onState() {
  if (!prev || prev.round !== S.round) {
    flips = store.get('cvc_flips_' + S.code + '_' + S.round) || { role: false, hour: false };
    eyeKey = ''; theftSeen = 0; chat = [];
  }
  if (S.chat) chat = S.chat.slice();
  if (S.phase === 'hours' && S.awake) {
    const k = S.round + '-' + S.hour;
    eyeAnim = k !== eyeKey; eyeKey = k;
    if (S.theftKey && S.theftKey !== theftSeen) { stealAnim = true; theftSeen = S.theftKey; } else stealAnim = false;
  } else { eyeAnim = false; stealAnim = false; }
  if (S.me.isPartner && !(prev && prev.me && prev.me.isPartner && prev.round === S.round)) {
    toast('تم اختيارك كشريك سري للمجرم! هدفك الآن التمويه وحماية المجرم من التصويت', 'secret', 9000);
  }
  if (S.phase === 'discussion' || S.phase === 'voting') startVoice();
  else if (voiceOn) stopVoice();
  render();
}

/* ================= الشارات الدائمة ================= */
function renderBadges() {
  const el = $('#badges');
  const inGame = S && S.phase !== 'lobby' && S.me.role;
  if (!inGame) { el.classList.add('hidden'); return; }
  const reveal = S.phase === 'reveal';
  let roleHtml, hourHtml;
  if (reveal && !flips.role) roleHtml = '<div class="badge unknown"><small>دورك</small>؟؟؟</div>';
  else {
    const r = S.me.isPartner ? 'partner' : S.me.role;
    const label = { criminal: 'مجرم', citizen: 'مواطن', partner: 'شريك سري' }[r];
    roleHtml = `<div class="badge ${r}"><small>دورك</small>${label}</div>`;
  }
  if (reveal && !flips.hour) hourHtml = '<div class="badge unknown"><small>ساعتك</small>؟</div>';
  else hourHtml = `<div class="badge hour"><small>ساعتك</small>${S.me.hour}</div>`;
  el.innerHTML = roleHtml + hourHtml;
  el.classList.remove('hidden');
}

/* ================= الشاشات ================= */
function render() {
  renderBadges();
  app.classList.remove('noscroll');
  if (!S) { built = 'home'; return home(); }
  switch (S.phase) {
    case 'lobby': built = 'lobby'; return lobby();
    case 'reveal': built = 'reveal'; return reveal();
    case 'hours': built = 'hours'; return hours();
    case 'partner': built = 'partner'; return partner();
    case 'discussion': return discussion();
    case 'voting': return voting();
    case 'end': built = 'end'; return endScreen();
  }
}

function home() {
  const urlCode = (new URLSearchParams(location.search).get('room') || '').toUpperCase().slice(0, 5);
  app.innerHTML = `
    <h1 class="logo">🗡️ المجرم والمواطنين</h1>
    <div class="sub">لعبة استنتاج جماعية — من سرق الجوهرة؟</div>
    <div class="glass pad stack">
      <input id="nm" class="field" maxlength="14" placeholder="اسمك" value="${esc(store.get('cvc_name') || '')}">
      <button class="btn red block" data-act="create">إنشاء غرفة جديدة</button>
      <div class="center mut">— أو —</div>
      <input id="code" class="field" maxlength="5" placeholder="رمز الغرفة" style="letter-spacing:6px;text-transform:uppercase;direction:ltr" value="${esc(urlCode)}">
      <button class="btn gold block" data-act="join">انضمام</button>
    </div>`;
}

function lobby() {
  const isHost = S.me.isHost;
  const n = S.players.filter((p) => p.connected).length;
  app.innerHTML = `
    <div class="glass pad stack">
      <div class="center mut">رمز الغرفة</div>
      <div class="code-box">${esc(S.code)}</div>
      <button class="btn ghost block" data-act="copy">📋 نسخ رابط الانضمام</button>
    </div>
    <div class="glass pad stack" style="margin-top:12px">
      <div class="row"><b>اللاعبون (${n})</b><span class="mut" style="margin-inline-start:auto;font-size:13px">الحد الأدنى ${S.minPlayers}</span></div>
      <div class="plist">${S.players.map((p) => `
        <div class="pitem"><span class="av">${p.avatar}</span><span class="nm">${esc(p.name)}${p.id === S.me.id ? ' (أنت)' : ''}</span>
        ${p.id === S.hostId ? '<span class="tag">👑 المدير</span>' : ''}<span class="dot ${p.connected ? '' : 'off'}"></span></div>`).join('')}
      </div>
    </div>
    <div style="margin-top:12px" class="stack">
      ${isHost ? `<button class="btn red block" data-act="start" ${n < S.minPlayers ? 'disabled' : ''}>ابدأ اللعبة</button>
        ${n < S.minPlayers ? `<div class="center mut" style="font-size:13px">يلزم ${S.minPlayers - n} لاعب إضافي على الأقل</div>` : ''}`

function reveal() {
  const m = S.me;
  const both = flips.role && flips.hour;
  const readyN = S.players.filter((p) => p.connected && p.ready).length;
  const total = S.players.filter((p) => p.connected).length;

  const roleBack = m.role === 'criminal'
    ? '<div class="ico">🗡️</div><div class="big" style="font-size:34px">مجرم</div><div style="font-size:12px">اسرق الجوهرة في ساعتك</div>'
    : '<div class="ico">🛡️</div><div class="big" style="font-size:34px">مواطن</div><div style="font-size:12px">راقب واكشف المجرم</div>';
  app.innerHTML = `
    <h1 class="logo" style="font-size:26px">اكشف بطاقتيك</h1>
    <div class="sub">اضغط على كل بطاقة لتنقلب — لا تُرِ شاشتك لأحد</div>

      <div class="flipwrap"><div class="card3d ${flips.role ? 'flipped' : ''}" data-act="flip" data-k="role">

function readyZone(both, iReady, readyN, total) {
  if (!both) return '<div class="center mut">اكشف البطاقتين للمتابعة</div>';

function hours() {
  app.classList.add('noscroll');
  const h = S.hour, mine = S.me.hour;
  const pills = [1, 2, 3, 4, 5].map((n) => `<div class="pill ${n < h ? 'past' : ''} ${n === h ? 'now' : ''} ${n === mine ? 'mine' : ''}">${n}</div>`).join('');
  const head = `<div class="clock">${pills}</div><div class="bar"><i data-bar="1" data-start="${S.endsAt - 7000}" data-end="${S.endsAt}"></i></div>`;
  if (!S.awake) {
    app.innerHTML = `<div class="stage">${head}<div class="sleep"><div class="zz">😴</div><div>عيناك مغمضتان الآن...<br>انتظر ساعتك</div></div></div>`;
    return;
  }
  const pr = S.present, n = pr.length;
  const seats = pr.map((p, i) => {
    const a = (2 * Math.PI * i) / n - Math.PI / 2 + (n === 1 ? Math.PI / 2 : 0);
    const x = 50 + 44 * Math.cos(a), y = 50 + 44 * Math.sin(a);
    return `<div class="seat ${p.id === S.me.id ? 'me' : ''}" style="left:${x}%;top:${y}%"><div class="av">${p.avatar}</div><div class="nm">${p.id === S.me.id ? 'أنت' : esc(p.name)}</div></div>`;
  }).join('');
  const table = S.gemOnTable
    ? `<div class="gem">💎</div>`
    : (stealAnim ? `<div class="gem steal">💎</div>` : `<div class="empty-slot">فارغة</div>`);
  app.innerHTML = `
    <div class="stage ${eyeAnim ? 'opening' : ''}">
      ${eyeAnim ? '<div class="eyelid top"></div><div class="eyelid bot"></div>' : ''}
      ${head}
      ${S.witnessOf ? `<div class="alert">👁️ لقد رأيت ${esc(S.witnessOf)} يسرق الجوهرة!</div>` : ''}
      <div class="tablearea"><div class="table">${table}</div>${seats}</div>
      <div class="center mut" style="font-size:13px">${n > 1 ? `معك على الطاولة ${n - 1} ${n - 1 === 1 ? 'لاعب' : 'لاعبين'}` : 'أنت وحدك على الطاولة'}</div>

    </div>`;
}

    <div class="glass pad center" style="margin-top:12px">

/* ================= التفاعل ================= */
document.addEventListener('click', (e) => {
  resumeAudio();
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'create' || act === 'join') {
    const name = $('#nm').value.trim();
    if (!name) return toast('اكتب اسمك أولاً');
    store.set('cvc_name', name);
    if (act === 'create') {
      socket.emit('room:create', { name, playerId: myId }, (res) => {
        if (res && res.ok) store.set('cvc_room', res.code); else toast((res && res.error) || 'تعذر الإنشاء');
      });
    } else {
      const code = $('#code').value.trim().toUpperCase();
      if (code.length !== 5) return toast('أدخل رمز الغرفة (5 أرقام/أحرف)');
      joinRoom(code, name, false);
    }
  } else if (act === 'copy') {
    const link = location.origin + '/?room=' + S.code;
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('تم نسخ الرابط ✅', '', 2000)).catch(() => toast(link, '', 8000));
  } else if (act === 'start') socket.emit('game:start');
  else if (act === 'replay') socket.emit('game:replay');
  else if (act === 'leave') { socket.emit('room:leave'); store.del('cvc_room'); stopVoice(); S = null; prev = null; render(); }
  else if (act === 'flip') {
    const k = t.dataset.k;
    flips[k] = true;
    store.set('cvc_flips_' + S.code + '_' + S.round, flips);
    t.classList.add('flipped');
    renderBadges();
    const total = S.players.filter((p) => p.connected).length;
    const readyN = S.players.filter((p) => p.connected && p.ready).length;
    const iReady = (S.players.find((p) => p.id === S.me.id) || {}).ready;
    $('#readyzone').innerHTML = readyZone(flips.role && flips.hour, iReady, readyN, total);
  } else if (act === 'ready') socket.emit('player:ready');
  else if (act === 'steal') socket.emit('gem:steal');
  else if (act === 'pick') socket.emit('partner:choose', { id: t.dataset.id });
  else if (act === 'wantvote') socket.emit('vote:early', { want: !S.iWantVote });
  else if (act === 'vote') socket.emit('vote:cast', { id: t.dataset.id });
  else if (act === 'mic') toggleMic();
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'chatform') return;
  e.preventDefault();
  const inp = $('#chatin');
  const text = inp.value.trim();
  if (text) socket.emit('chat:send', { text });
  inp.value = '';
  inp.focus();
});

/* ================= الدردشة الصوتية (WebRTC عبر إشارات Socket.io) ================= */
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
let voiceOn = false, localStream = null, actx = null, localAnalyser = null;
const peers = new Map(); // id -> {pc, audio, analyser, pending}

function resumeAudio() { if (actx && actx.state === 'suspended') actx.resume().catch(() => {}); }
function getCtx() {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
  return actx;
}
function makeAnalyser(stream) {
  const c = getCtx();
  if (!c) return null;
  try {
    const src = c.createMediaStreamSource(stream);
    const an = c.createAnalyser(); an.fftSize = 512;
    src.connect(an);
    return { an, buf: new Uint8Array(an.fftSize) };
  } catch { return null; }
}

async function startVoice() {
  if (voiceOn) return;
  voiceOn = true;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    localStream.getAudioTracks().forEach((t) => { t.enabled = !micMuted; });
    localAnalyser = makeAnalyser(localStream);
  } catch {
    localStream = null;
    toast('تعذّر الوصول للمايكروفون — ستسمع الآخرين فقط');
  }
  if (!voiceOn) return;
  joinVoiceChannel();
}
function joinVoiceChannel() {
  socket.emit('voice:join', {}, (res) => { ((res && res.peers) || []).forEach((id) => makePeer(id, true)); });
}
function stopVoice() {
  if (!voiceOn) return;
  voiceOn = false;
  socket.emit('voice:leave');
  closeAllPeers();
  if (localStream) localStream.getTracks().forEach((t) => t.stop());
  localStream = null; localAnalyser = null;
}
function closePeer(id) {
  const e = peers.get(id);
  if (!e) return;
  try { e.pc.close(); } catch {}
  if (e.audio) e.audio.remove();
  peers.delete(id);
}
function closeAllPeers() { [...peers.keys()].forEach(closePeer); }

function makePeer(id, initiator) {
  closePeer(id);
  const pc = new RTCPeerConnection(ICE);
  const e = { pc, audio: null, analyser: null, pending: [] };
  peers.set(id, e);
  if (localStream) localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  else pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.onicecandidate = (ev) => { if (ev.candidate) socket.emit('rtc:signal', { to: id, data: { candidate: ev.candidate } }); };
  pc.ontrack = (ev) => {
    if (e.audio) return;
    const a = document.createElement('audio');
    a.autoplay = true; a.playsInline = true; a.srcObject = ev.streams[0];
    $('#audio-host').appendChild(a);
    a.play().catch(() => {});
    e.audio = a;
    e.analyser = makeAnalyser(ev.streams[0]);
  };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' && pc.restartIce) pc.restartIce(); };
  if (initiator) {
    pc.onnegotiationneeded = async () => {
      try {
        await pc.setLocalDescription(await pc.createOffer());
        socket.emit('rtc:signal', { to: id, data: { sdp: pc.localDescription } });
      } catch {}
    };
  }
  return e;
}
async function flushIce(e) {
  while (e.pending.length) { try { await e.pc.addIceCandidate(e.pending.shift()); } catch {} }
}
socket.on('rtc:signal', async ({ from, data }) => {
  if (!voiceOn || !data) return;
  let e = peers.get(from);
  try {
    if (data.sdp) {
      if (data.sdp.type === 'offer') {
        e = makePeer(from, false);
        await e.pc.setRemoteDescription(data.sdp);
        await flushIce(e);
        await e.pc.setLocalDescription(await e.pc.createAnswer());
        socket.emit('rtc:signal', { to: from, data: { sdp: e.pc.localDescription } });
      } else if (e) {
        await e.pc.setRemoteDescription(data.sdp);
        await flushIce(e);
      }
    } else if (data.candidate && e) {
      if (e.pc.remoteDescription) await e.pc.addIceCandidate(data.candidate); else e.pending.push(data.candidate);
    }
  } catch {}
});
socket.on('voice:left', ({ id }) => closePeer(id));

function toggleMic() {
  micMuted = !micMuted;
  if (localStream) localStream.getAudioTracks().forEach((t) => { t.enabled = !micMuted; });
  document.querySelectorAll('[data-mic]').forEach((b) => { b.classList.toggle('muted', micMuted); b.textContent = micMuted ? '🔇' : '🎙️'; });
}

/* ================= حلقة العرض: العدادات + وهج المتحدث (بدون setInterval) ================= */
function level(a) {
  if (!a) return 0;
  a.an.getByteTimeDomainData(a.buf);
  let s = 0;
  for (let i = 0; i < a.buf.length; i++) { const v = (a.buf[i] - 128) / 128; s += v * v; }
  return Math.sqrt(s / a.buf.length);
}
let lastTick = 0;
function frame(ts) {
  if (ts - lastTick > 120) {
    lastTick = ts;
    const now = Date.now() + offset;
    document.querySelectorAll('[data-end]').forEach((el) => {
      const end = +el.dataset.end;
      const left = Math.max(0, end - now);
      if (el.dataset.bar) {
        const st = +el.dataset.start;
        el.style.transform = `scaleX(${Math.max(0, Math.min(1, left / (end - st)))})`;
      } else if (el.dataset.fmt === 'mmss') {
        const s = Math.ceil(left / 1000);
        el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      } else el.textContent = Math.ceil(left / 1000);
    });
    if (voiceOn) {
      const speaking = new Set();
      if (!micMuted && level(localAnalyser) > 0.03) speaking.add(S && S.me.id);
      peers.forEach((e, id) => { if (level(e.analyser) > 0.03) speaking.add(id); });
      document.querySelectorAll('.pc[data-pid]').forEach((el) => el.classList.toggle('speaking', speaking.has(el.dataset.pid)));
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

render();
})();
</script>
